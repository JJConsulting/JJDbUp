name: Build and publish NuGet

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/JJConsulting.DbUp/JJConsulting.DbUp.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JJConsulting.DbUp.slnx

      - name: Build
        run: dotnet build JJConsulting.DbUp.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test with SQL Server Testcontainers
        run: dotnet test --solution JJConsulting.DbUp.slnx --configuration Release --no-build --no-restore --report-xunit-trx --results-directory TestResults

      - name: Pack
        run: dotnet pack "$PROJECT" --configuration Release --no-build --output artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Log in to NuGet.org using OIDC
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
