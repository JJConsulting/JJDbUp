name: Test

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JJConsulting.DbUp.slnx

      - name: Build
        run: dotnet build JJConsulting.DbUp.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test with SQL Server Testcontainers
        run: dotnet test --solution JJConsulting.DbUp.slnx --configuration Release --no-build --no-restore --report-xunit-trx --results-directory TestResults
